{% extends 'base.html' %}
{% block content %}
<h2>Respond to Complaint</h2>
<form method="post" class="card p-4 shadow-sm mt-3">
  {% csrf_token %}
  {% for field in form %}
    <div class="mb-3">
      <label class="form-label">{{ field.label }}</label>
      {{ field }}
    </div>
  {% endfor %}
  <button class="btn btn-primary" type="submit">Submit Response</button>
</form>
{% endblock %}
