<div class="card h-100">
  <div class="card-header">Menu</div>
  <div class="list-group list-group-flush">
    {% with path=request.path %}
      <a class="list-group-item list-group-item-action{% if path == '/billing/customer/dashboard/' or path == '/billing/customer/dashboard' %} active{% endif %}"
         href="/billing/customer/dashboard/">Dashboard</a>
      <a class="list-group-item list-group-item-action{% if path|slice:':22' == '/billing/customer/bills' or path == '/billing/customer/bills/' %} active{% endif %}"
         href="/billing/customer/bills/">My Bills</a>
      <a class="list-group-item list-group-item-action{% if path|slice:':16' == '/payments/history' or path == '/payments/history/' %} active{% endif %}"
         href="/payments/history/">Payment History</a>
      <a class="list-group-item list-group-item-action{% if path|slice:':11' == '/complaints' or path == '/complaints/' %} active{% endif %}"
         href="/complaints/">Complaints</a>
      <a class="list-group-item list-group-item-action{% if path|slice:':19' == '/billing/water-updates' or path == '/billing/water-updates/' %} active{% endif %}"
         href="/billing/water-updates/">Water Updates</a>
      <a class="list-group-item list-group-item-action{% if path|slice:':17' == '/accounts/profile' or path == '/accounts/profile/' %} active{% endif %}"
         href="/accounts/profile/">Profile</a>
    {% endwith %}
  </div>
</div>
