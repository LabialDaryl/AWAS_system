{% extends 'base.html' %}
{% block content %}
<h2>Search Users</h2>
<form method="get" class="row g-2 mb-3">
  <div class="col-md-6">{{ form.search_query }}</div>
  <div class="col-md-3">{{ form.purok_filter }}</div>
  <div class="col-md-3"><button class="btn btn-primary w-100" type="submit">Search</button></div>
</form>
<table class="table table-striped">
  <thead><tr><th>Name</th><th>Username</th><th>Purok</th></tr></thead>
  <tbody>
  {% for u in users %}
    <tr><td>{{ u.get_full_name }}</td><td>{{ u.username }}</td><td>{{ u.purok_number }}</td></tr>
  {% empty %}
    <tr><td colspan="3" class="text-center">No users found.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
